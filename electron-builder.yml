appId: com.agentgraph.drawio
productName: AgentGraph DrawIO
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: AgentGraphDrawIO
  signAndEditExecutable: false
forceCodeSigning: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: AgentGraph DrawIO
  uninstallDisplayName: AgentGraph DrawIO
  createDesktopShortcut: always
  artifactName: ${productName}-Setup-${version}.${ext}
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
